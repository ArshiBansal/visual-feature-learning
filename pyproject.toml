[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "visual-feature-learning"
version = "0.1.0"
description = "A pure-NumPy convolutional neural network trained and evaluated on CIFAR-10."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.26,<2",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.35",
]

[project.optional-dependencies]
datasets = [
    "tensorflow>=2.16,<3",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_feature_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"