[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "visual-feature-learning"
version = "0.1.0"
description = "A convolutional neural network implemented from scratch with NumPy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "plotly>=5.18",
    "streamlit>=1.35",
]

[project.optional-dependencies]
datasets = [
    "tensorflow>=2.16",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/visual_feature_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # import sorting
    "B",    # common bug patterns
    "UP",   # modern Python syntax
]
ignore = [
    "E501", # line length is handled by the formatter
]

[tool.ruff.format]
quote-style = "double"